services:
  collector:
    build:
      context: ./apps/collector
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: dirigera-collector
    restart: unless-stopped
    volumes:
      - sqlite-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/dirigera_monitor.db
      - DIRIGERA_HUB_IP=${DIRIGERA_HUB_IP}
      - DIRIGERA_TOKEN=${DIRIGERA_TOKEN}
      - POLL_INTERVAL_MINUTES=${POLL_INTERVAL_MINUTES:-5}
      - PORT=3001
    ports:
      - "7352:3001"
    networks:
      - default
      - host-network

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: dirigera-dashboard
    restart: unless-stopped
    depends_on:
      - collector
    environment:
      # API_URL is injected at container startup for runtime configuration
      # Use your server's IP for remote access (e.g., http://192.168.1.100:7352)
      - API_URL=${API_URL:-http://localhost:7352}
    ports:
      - "7353:3000"

volumes:
  sqlite-data:

networks:
  host-network:
    driver: bridge
